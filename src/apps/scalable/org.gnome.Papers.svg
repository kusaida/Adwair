<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="128" height="128" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- same palette as accessories-document-viewer -->
    <linearGradient id="gTile" gradientUnits="userSpaceOnUse" x1="240" y1="455" x2="240" y2="57">
      <stop offset="0" stop-color="#c2283a"/>
      <stop offset="1" stop-color="#ee4b47"/>
    </linearGradient>
    <linearGradient id="gPaper" gradientUnits="userSpaceOnUse" x1="240" y1="432" x2="240" y2="72">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1efeb"/>
    </linearGradient>
    <linearGradient id="gFold" gradientUnits="userSpaceOnUse" x1="348.845" y1="163.593" x2="456.527" y2="55.911">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffefcc"/>
    </linearGradient>
    <linearGradient id="gBar" gradientUnits="userSpaceOnUse" x1="0" y1="338" x2="0" y2="262">
      <stop offset="0" stop-color="#b81e31"/>
      <stop offset="1" stop-color="#ff5c5c"/>
    </linearGradient>
    <linearGradient id="gFig" gradientUnits="userSpaceOnUse" x1="0" y1="344" x2="0" y2="244">
      <stop offset="0" stop-color="#fbdcdd"/>
      <stop offset="1" stop-color="#fdeeee"/>
    </linearGradient>
    <linearGradient id="gTitle" gradientUnits="userSpaceOnUse" x1="0" y1="116" x2="0" y2="90">
      <stop offset="0" stop-color="#b81e31"/>
      <stop offset="1" stop-color="#e8434b"/>
    </linearGradient>
    <linearGradient id="gBlue" gradientUnits="userSpaceOnUse" x1="120" y1="60" x2="400" y2="440">
      <stop offset="0" stop-color="#3a7de0"/>
      <stop offset="1" stop-color="#8a3fb0"/>
    </linearGradient>
    <linearGradient id="gGray" gradientUnits="userSpaceOnUse" x1="120" y1="60" x2="400" y2="440">
      <stop offset="0" stop-color="#f4f2ee"/>
      <stop offset="1" stop-color="#cdc9c3"/>
    </linearGradient>
    <filter id="fBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="fBlurS" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <!-- page silhouette with dog-ear, from the pack grid -->
    <path id="page" d="m135.99 56.24c-44.32 0-80 35.68-80 80v240c-0.02 9.81 1.77 19.55 5.28 28.72 3.51 9.16 8.69 17.6 15.26 24.89 6.57 7.3 14.44 13.31 23.19 17.75 8.76 4.44 18.26 7.22 28.03 8.21 4.64-0.16 9.06-0.29 11.59-0.05h0.01q4.69 0.48 9.52 0.48h227.12c44.32 0 80-35.68 80-80v-141.22c0-42.86-135.72-178.78-178.57-178.78h-128.55z"/>
    <clipPath id="cLeftOnly"><rect x="0" y="0" width="120" height="512"/></clipPath>
    <linearGradient id="gFadeX" gradientUnits="userSpaceOnUse" x1="170" y1="0" x2="330" y2="0">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="mBottomOnly" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect x="0" y="330" width="512" height="182" fill="url(#gFadeX)"/>
    </mask>
    <clipPath id="cTileIn"><rect x="40" y="40" width="432" height="432" rx="98"/></clipPath>
    <clipPath id="cPage"><use href="#page"/></clipPath>
    <clipPath id="cStack"><rect x="0" y="380" width="512" height="132"/></clipPath>
    <path id="fold" d="m277.42 56.46c28.57 7.14 35.71 50 42.85 78.56 6.93 27.73 22.71 46.75 64.29 57.15 28.56 7.14 57.14 4.57 71.43 42.86 0-0.18-0.04-0.35-0.04-0.52-0.77-49.97-118.6-169.55-172.91-177.8q-0.7-0.06-1.4-0.1-0.7-0.05-1.4-0.08-0.71-0.03-1.41-0.05-0.7-0.02-1.41-0.02z"/>
  </defs>

  <!-- tile drop shadow -->
  <rect x="33" y="47" width="446" height="446" rx="103.5" fill="#000" opacity=".25" filter="url(#fBlur)"/>

  <!-- red tile -->
  <path fill="url(#gTile)" d="m136.55 33h238.91c57.19 0 103.56 46.36 103.56 103.55v238.91c0 57.19-46.37 103.56-103.56 103.56h-238.91c-57.19 0-103.55-46.37-103.55-103.56v-238.91c0-57.19 46.36-103.55 103.55-103.55z"/>

  <!-- листы, стеснительно выглядывающие слева и снизу -->
  <g clip-path="url(#cTileIn)">
    <!-- серый лист: левый край расходится клином книзу -->
    <g clip-path="url(#cLeftOnly)">
      <g transform="rotate(2.8 130 90)">
        <use href="#page" transform="translate(-2 2)" fill="#000" opacity=".3" filter="url(#fBlurS)"/>
        <use href="#page" fill="url(#gGray)"/>
      </g>
    </g>
    <!-- синий лист: нижний край провисает слева и уходит под страницу -->
    <g mask="url(#mBottomOnly)">
      <g transform="rotate(-3.2 388 88)">
        <use href="#page" transform="translate(0 2)" fill="#000" opacity=".3" filter="url(#fBlurS)"/>
        <use href="#page" fill="url(#gBlue)"/>
      </g>
    </g>
  </g>

  <!-- page edge shadow + page -->
  <use href="#page" transform="translate(0 4)" fill="#000" opacity=".16" filter="url(#fBlurS)"/>
  <use href="#page" fill="url(#gPaper)"/>

  <g clip-path="url(#cPage)">
    <!-- title block -->
    <rect x="100" y="92" width="110" height="24" rx="12" fill="url(#gTitle)"/>
    <rect x="100" y="128" width="66" height="12" rx="6" fill="#000" opacity=".14"/>

    <!-- строки текста: простой ритм -->
    <rect x="100" y="244" width="316" height="12" rx="6" fill="#000" opacity=".13"/>
    <rect x="100" y="284" width="316" height="12" rx="6" fill="#000" opacity=".13"/>
    <rect x="100" y="324" width="316" height="12" rx="6" fill="#000" opacity=".13"/>
    <rect x="100" y="364" width="316" height="12" rx="6" fill="#000" opacity=".13"/>
    <rect x="100" y="404" width="190" height="12" rx="6" fill="#000" opacity=".13"/>

    <!-- fold shadow on the page -->
    <use href="#fold" transform="translate(-6 8)" fill="#000" opacity=".3" filter="url(#fBlurS)"/>
  </g>

  <!-- dog-ear flap -->
  <use href="#fold" fill="url(#gFold)"/>

  <!-- очки в стиле оригинального Papers -->
  <defs>
    <clipPath id="cL"><circle cx="213" cy="326" r="33"/></clipPath>
    <clipPath id="cR"><circle cx="326" cy="326" r="33"/></clipPath>
  </defs>
  <g transform="translate(270 330) scale(1.28) translate(-270 -326)">
  <!-- тень -->
  <g filter="url(#fBlurS)" opacity=".3" transform="translate(0 8)" fill="#000">
    <circle cx="213" cy="326" r="50"/><circle cx="326" cy="326" r="50"/>
  </g>
  <!-- линзы с «увеличенным» текстом -->
  <circle cx="213" cy="326" r="36" fill="#fff" fill-opacity=".9"/>
  <circle cx="326" cy="326" r="36" fill="#fff" fill-opacity=".9"/>
  <g fill="none" stroke="#000" stroke-opacity=".16" stroke-width="12" stroke-linecap="round">
    <g clip-path="url(#cL)">
      <path d="M170 306Q213 322 256 306"/><path d="M170 334Q213 350 256 334"/>
    </g>
    <g clip-path="url(#cR)">
      <path d="M283 306Q326 322 369 306"/><path d="M283 334Q326 350 369 334"/>
    </g>
  </g>
  <!-- оправа: два кольца + плоская перемычка снизу -->
  <g fill="#231f33">
    <path fill-rule="evenodd" d="M213 276a50 50 0 1 0 0 100a50 50 0 1 0 0-100ZM213 293a33 33 0 1 1 0 66a33 33 0 1 1 0-66Z"/>
    <path fill-rule="evenodd" d="M326 276a50 50 0 1 0 0 100a50 50 0 1 0 0-100ZM326 293a33 33 0 1 1 0 66a33 33 0 1 1 0-66Z"/>
    <!-- мостик -->
    <path d="M254 312q22-16 40 0v14q-20-10-40 0Z"/>
    <!-- нижняя плоская часть, как в оригинале -->
  </g>
  <!-- дужки -->
  <g fill="none" stroke="#231f33" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M181 351L134 278C128 268 136 259 147 262C153 264 157 268 159 272"/>
    <path d="M374 340V268C374 259 382 253 390 257"/>
  </g>
  </g>
</svg>
