<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0 -0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="background" x1="32" y1="4" x2="32" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.58" stop-color="#f5f6fa" />
      <stop offset="1" stop-color="#dfe3ec" />
    </linearGradient>
    <linearGradient id="cloud" x1="32" y1="11" x2="32" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b49cff" />
      <stop offset="0.48" stop-color="#6578ff" />
      <stop offset="1" stop-color="#243ef0" />
    </linearGradient>
    <linearGradient id="cloudGloss" x1="32" y1="12" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.26" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <g id="cloudShape">
      <ellipse cx="28.4" cy="21.7" rx="9.1" ry="9.7" />
      <ellipse cx="39.6" cy="25.3" rx="9.1" ry="10.3" />
      <ellipse cx="44.1" cy="35.6" rx="7.9" ry="8.2" />
      <ellipse cx="35.3" cy="42.6" rx="9.1" ry="9.4" />
      <ellipse cx="24.1" cy="40.2" rx="8.8" ry="8.5" />
      <ellipse cx="19.6" cy="29" rx="7.6" ry="9.4" />
      <ellipse cx="32" cy="32.5" rx="13.5" ry="12.5" />
    </g>
    <clipPath id="cloudClip">
      <use href="#cloudShape" />
    </clipPath>
    <filter id="cloudShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="0.45" result="expanded" />
      <feComposite in="expanded" in2="SourceAlpha" operator="out" result="outlineAlpha" />
      <feFlood flood-color="#ffffff" flood-opacity="0.34" result="outlineColor" />
      <feComposite in="outlineColor" in2="outlineAlpha" operator="in" result="outline" />
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.75" result="blur" />
      <feOffset in="blur" dy="1" result="offset" />
      <feColorMatrix in="offset" type="matrix" values="0 0 0 0 0.10  0 0 0 0 0.16  0 0 0 0 0.55  0 0 0 .34 0" result="shadowColor" />
      <feMerge>
        <feMergeNode in="shadowColor" />
        <feMergeNode in="outline" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="13" fill="url(#background)" />
  <use href="#cloudShape" fill="url(#cloud)" filter="url(#cloudShadow)" />
  <rect x="10" y="10" width="45" height="25" fill="url(#cloudGloss)" clip-path="url(#cloudClip)" />
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.9">
    <path d="m23 26.5 3.8 6-3.8 6" />
    <path d="M33.5 38.5H42" />
  </g>
  <rect x="4.45" y="4.45" width="55.1" height="55.1" rx="12.55" fill="none" stroke="#ffffff" stroke-opacity="0.42" stroke-width="0.9" />
</svg>