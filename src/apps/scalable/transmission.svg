<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="64" height="64" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- тень плитки из шаблона (PNG, масштаб 0.245) -->
    <image id="transmission-shadow" width="251" height="251" xlink:href="data:image/png;base64,"/>

    <!-- плитка: рамка slate (светлее сверху) и светлая внутренняя часть -->
    <linearGradient id="transmission-frame" x1="0" y1="4" x2="0" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#acb2b6"/>
      <stop offset="1" stop-color="#6f8396"/>
    </linearGradient>
    <linearGradient id="transmission-face" x1="0" y1="7" x2="0" y2="57" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f3f4f7"/>
      <stop offset="1" stop-color="#d6dade"/>
    </linearGradient>

    <!-- стрелка -->
    <linearGradient id="transmission-arrow" x1="0" y1="13" x2="0" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b5b5b"/>
      <stop offset="1" stop-color="#3a3a3a"/>
    </linearGradient>

    <!-- красный валик: вертикальный градиент + затемнение к торцам -->
    <linearGradient id="transmission-roller" x1="0" y1="2.6" x2="0" y2="13.4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8402e"/>
      <stop offset=".45" stop-color="#d42b1d"/>
      <stop offset="1" stop-color="#8b150d"/>
    </linearGradient>
    <linearGradient id="transmission-roller-ends" x1="11.4" y1="0" x2="52.6" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#46120e" stop-opacity=".5"/>
      <stop offset=".2" stop-color="#46120e" stop-opacity="0"/>
      <stop offset=".8" stop-color="#46120e" stop-opacity="0"/>
      <stop offset="1" stop-color="#46120e" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="transmission-tip" x1="0" y1="6" x2="0" y2="9.6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f1f3f4"/>
      <stop offset="1" stop-color="#9ea4a9"/>
    </linearGradient>

    <!-- серебристая лента -->
    <linearGradient id="transmission-band" x1="0" y1="2" x2="0" y2="33" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c4c8cb"/>
      <stop offset=".2" stop-color="#e2e4e6"/>
      <stop offset=".5" stop-color="#80858a"/>
      <stop offset=".85" stop-color="#a3a8ab"/>
      <stop offset="1" stop-color="#8e9396"/>
    </linearGradient>
    <linearGradient id="transmission-band-sides" x1="25.6" y1="0" x2="38.4" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000" stop-opacity=".2"/>
      <stop offset=".18" stop-color="#000" stop-opacity="0"/>
      <stop offset=".82" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".2"/>
    </linearGradient>

    <!-- мягкие тени (без filter) -->
    <radialGradient id="transmission-glow" cx="32" cy="8" r="17" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b150d" stop-opacity=".4"/>
      <stop offset="1" stop-color="#8b150d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="transmission-band-shadow" x1="0" y1="33" x2="0" y2="37" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000" stop-opacity=".35"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- тень плитки -->
  <use xlink:href="#transmission-shadow" transform="translate(1.4 2.4) scale(.245)"/>

  <!-- плитка 56x56, r=13; обводка 3 px, внутри r=10 -->
  <rect x="4" y="4" width="56" height="56" rx="13" fill="url(#transmission-frame)"/>
  <rect x="7" y="7" width="50" height="50" rx="10" fill="url(#transmission-face)"/>

  <!-- красноватый отсвет под валиком -->
  <path d="M15 8A17 17 0 0 0 49 8z" fill="url(#transmission-glow)"/>

  <!-- двойная стрелка -->
  <path fill="url(#transmission-arrow)" d="M31.2 13.25Q32 12.7 32.8 13.25L41.5 21.65Q42.2 22.5 41.2 23.3H38.1V42.3H41.2Q42.2 43 41.5 44.1L32.8 52.8Q32 53.6 31.2 52.8L22.5 44.1Q21.8 43 22.8 42.3H25.9V23.3H22.8Q21.8 22.5 22.5 21.65z"/>
  <rect x="25.9" y="33" width="12.2" height="4" fill="url(#transmission-band-shadow)"/>

  <!-- серебристые торцы валика -->
  <path fill="url(#transmission-tip)" d="M12 6.1L10.2 6.6Q9.3 6.9 9.3 7.8Q9.3 8.7 10.2 9L12 9.5z"/>
  <path fill="url(#transmission-tip)" d="M52 6.1L53.8 6.6Q54.7 6.9 54.7 7.8Q54.7 8.7 53.8 9L52 9.5z"/>

  <!-- красный валик -->
  <path id="transmission-roller-shape" fill="url(#transmission-roller)" d="M12.4 5.3C18 3.9 25 2.8 32 2.6C39 2.8 46 3.9 51.6 5.3Q52.6 5.6 52.6 6.6V9Q52.6 10 51.6 10.3C46 12 39 13.2 32 13.4C25 13.2 18 12 12.4 10.3Q11.4 10 11.4 9V6.6Q11.4 5.6 12.4 5.3z"/>
  <path fill="url(#transmission-roller-ends)" d="M12.4 5.3C18 3.9 25 2.8 32 2.6C39 2.8 46 3.9 51.6 5.3Q52.6 5.6 52.6 6.6V9Q52.6 10 51.6 10.3C46 12 39 13.2 32 13.4C25 13.2 18 12 12.4 10.3Q11.4 10 11.4 9V6.6Q11.4 5.6 12.4 5.3z"/>

  <!-- серебристая лента -->
  <path fill="url(#transmission-band)" d="M25.6 2H38.4C38.2 12 37.6 22 37.4 32.2Q37.4 33 36.6 33H27.4Q26.6 33 26.6 32.2C26.4 22 25.8 12 25.6 2z"/>
  <path fill="url(#transmission-band-sides)" d="M25.6 2H38.4C38.2 12 37.6 22 37.4 32.2Q37.4 33 36.6 33H27.4Q26.6 33 26.6 32.2C26.4 22 25.8 12 25.6 2z"/>
</svg>
