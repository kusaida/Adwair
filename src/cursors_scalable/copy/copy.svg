<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="32" height="32" version="1.1" viewBox="2.4912 1.5912 28.0702 28.0702">
  <defs>
    <filter id="shadow-blur" filterUnits="userSpaceOnUse" x="-4" y="-4" width="40" height="40" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="0.65531483"/>
    </filter>
    <path id="cursor-shape" d="M 6.0,5.0 V 22.33 L 11.33,17.0 H 18.0 Z"/>
  </defs>
  <!-- cursor shadow -->
  <g filter="url(#shadow-blur)" opacity="0.2" transform="translate(0.3 0.8)">
    <use xlink:href="#cursor-shape" fill="#000000" stroke="#000000" stroke-width="2.667" stroke-linejoin="round"/>
  </g>
  <!-- cursor: white outline, black body -->
  <use xlink:href="#cursor-shape" fill="none" stroke="#ffffff" stroke-width="2.667" stroke-linejoin="round" stroke-linecap="round"/>
  <use xlink:href="#cursor-shape" fill="#000000"/>
  <!-- badge shadow -->
  <circle cx="22.0" cy="19.67" r="7.65" fill="#000000" opacity="0.2" filter="url(#shadow-blur)" transform="translate(0.3 0.8)"/>
  <!-- badge -->
  <circle cx="22.0" cy="19.67" r="6.9" fill="#26a269" stroke="#ffffff" stroke-width="1.5"/>
  <g transform="translate(22.0 19.67) scale(1.2321) translate(-24.6 -24.6)">
    <path d="M 24.6,21.5 V 27.7 M 21.5,24.6 H 27.7" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round"/>
  </g>
</svg>
